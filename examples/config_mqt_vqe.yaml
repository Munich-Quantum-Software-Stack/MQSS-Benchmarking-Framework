benchmark: core/mqt_bench/vqe_su2

benchmark_params:
  num_qubits: 2
  level: ALG

adapter: mqss_qiskit
backend: QExa20

credentials:
  mqss_token: ""

shots: 200

output_dir: "./results"

# Controls what is generated
report:
  analysis:
    enabled: true
    visualization:
      enabled: true
      show: true

# Controls how results are persisted
storage:
  enabled: true
  type: "file"  # "file" or "sqlite"
  file:
    format: "json"
  sqlite:
    db_path: "./mqssbench.db"

profiling:
  enabled: true