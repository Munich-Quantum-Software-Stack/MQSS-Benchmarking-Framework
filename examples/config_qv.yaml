benchmark: core/native/quantum_volume

benchmark_params:
  num_qubits: 2
  depth: 2
  trials: 2

adapter: mqss_qiskit
adapter_params:
  backend: QExa20
  backend_params:
    queued: true
    no_modify: true
  credentials:
    mqss_token: ""
  shots: 200

output_dir: "./results"

# Controls how results are persisted
storage:
  enabled: true
  type: "file" 
  file:
    format: "json"

profiling:
  enabled: true