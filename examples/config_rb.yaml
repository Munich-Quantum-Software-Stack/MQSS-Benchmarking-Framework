benchmark: core/native/randomized_benchmarking

benchmark_params: # benchamark specific params
  num_qubits: 2
  lengths: [2,3,4,5,6,7]
  num_sequences: 3

adapter: mqss_qiskit
adapter_params:
  backend: EQE1
  credentials:
    mqss_token: ""
  shots: 1024

output_dir: "./results"

# Controls what is generated
report:
  analysis:
    enabled: true
    visualization:
      enabled: true
      show: true

# Controls how results are persisted
storage:
  enabled: true
  type: "file"  # "file" or "sqlite"
  file:
    format: "json"
  sqlite:
    db_path: "./mqssbench.db"
  
profiling:
  enabled: true
  metrics: # not defining metrics means all of them are requested
    - transpiler
    - submitter