[project]
name = "mbf-example-plugin"
version = "0.1.0"
description = "Example MBF plugin."
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."mbf"]
mbf_example_plugin = "mbf_example_plugin:register"