benchmark: core/native/transpiled_randomized_benchmarking

benchmark_params: # benchamark specific params
  num_qubits: 2
  lengths: [2, 4, 8, 16, 32, 64, 128]
  num_sequences: 20

adapter: qiskit_simulator
#backend: QExa20 

credentials:
  mqss_token: ""

shots: 1024

output_dir: "./results"

# Controls what is generated
report:
  analysis:
    enabled: true
    visualization:
      enabled: true
      show: true

# Controls how results are persisted
storage:
  enabled: true
  type: "file"  # "file" or "sqlite"
  file:
    format: "json"
  sqlite:
    db_path: "./mqssbench.db"
  
profiling:
  enabled: true
  metrics: # not defining metrics means all of them are requested
    - transpiler
    - submitter