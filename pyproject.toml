[project]
name = "mqss-benchmarking-framework"
version = "1.0.0"
description = "Automated and reproducible benchmarking framework for quantum computing workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mqss-pennylane-adapter==1.1.2",
    "mqss-qiskit>=0.2.0",
    "mqt-bench>=2.0.0",
    "pennylane>=0.41.1",
    "qiskit-experiments>=0.5.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "qiskit-aer>=0.13.3",
    "pyyaml>=6.0.3",
    "colorama>=0.4.6",
    "dacite>=1.9.2",
    "pytest-cov>=7.0.0",
]
[project.scripts]
mqssbench = "mqssbench.cli.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff", "pylint", "pytest", "pytest-cov"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.1",
    "mkdocs-material>=9.6.9",
    "mkdocstrings[python]>=0.29.0",
    "pytest>=8.3.3",
]
